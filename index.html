<script>
    // ID Document dari Tautan Published Anda
    const SPREADSHEET_ID = "2PACX-1vS1hdumZbRrJpTE4tlFd6n5MWph6rzb8ByCg6h5CZLWuxTG0wctY-HkayFbU4Sp4i3_ZHdrdtdbwQsH";
    
    // URL Endpoint Google Visualization API (JSON Output)
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/e/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

    async function cariNilaiSiswa(e) {
        e.preventDefault();
        const inputNis = document.getElementById("nisInput").value.trim().replace(/\D/g, ""); // Ambil angka saja
        
        if (!inputNis) {
            tampilkanAlert("Masukkan nomor NIS yang valid!", "error");
            return;
        }

        tampilkanLoading(true);
        sembunyikanAlert();
        document.getElementById("areaHasil").classList.add("hidden");

        try {
            // Ambil data publik dari Google Spreadsheet
            const response = await fetch(GVIZ_URL);
            const rawText = await response.text();

            // Parsing response Google Visualization JSON
            const jsonString = rawText.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
            
            if (!jsonString || !jsonString[1]) {
                throw new Error("Format response Google Sheets tidak valid.");
            }

            const dataObj = JSON.parse(jsonString[1]);
            const table = dataObj.table;

            if (!table || !table.rows || table.rows.length === 0) {
                tampilkanAlert("Data spreadsheet kosong atau tidak dapat diakses.", "error");
                tampilkanLoading(false);
                return;
            }

            // Detect Index Kolom dari Header/Cols
            let nisColIndex = -1;
            let namaColIndex = -1;
            const headers = [];

            table.cols.forEach((col, idx) => {
                const label = col.label ? col.label.toUpperCase().trim() : "";
                headers.push(col.label || `Kolom ${idx + 1}`);
                
                if (label.includes("NIS")) nisColIndex = idx;
                if (label.includes("NAMA")) namaColIndex = idx;
            });

            // Jika header tidak terdeteksi di metadata cols, cek baris pertama (row 0)
            if (nisColIndex === -1 && table.rows.length > 0) {
                nisColIndex = 2; // Default Kolom C (Index 2)
                namaColIndex = 1; // Default Kolom B (Index 1)
            }

            let dataSiswa = null;

            // Pencarian NIS pada Baris Data
            for (let i = 0; i < table.rows.length; i++) {
                const row = table.rows[i].c;
                if (!row) continue;

                // Ambil nilai NIS dari sel
                const cellNisRaw = row[nisColIndex] ? (row[nisColIndex].v || row[nisColIndex].f || "") : "";
                const cellNisClean = String(cellNisRaw).trim().replace(/\D/g, "");

                if (cellNisClean === inputNis) {
                    const namaSiswa = row[namaColIndex] ? (row[namaColIndex].v || row[namaColIndex].f || "-") : "-";
                    const mapelObj = {};
                    let totalNilai = 0;
                    let jumlahMapel = 0;

                    // Iterasi Mata Pelajaran (Dimulai setelah kolom identitas/NIS)
                    const startMapelIndex = Math.max(nisColIndex, namaColIndex) + 1;
                    
                    for (let j = startMapelIndex; j < row.length; j++) {
                        const mapelName = headers[j] || `Mapel ${j}`;
                        const cellVal = row[j] ? row[j].v : null;

                        if (cellVal !== null && cellVal !== undefined && cellVal !== "") {
                            const valNum = parseFloat(cellVal);
                            if (!isNaN(valNum)) {
                                mapelObj[mapelName] = valNum;
                                totalNilai += valNum;
                                jumlahMapel++;
                            } else {
                                mapelObj[mapelName] = cellVal;
                            }
                        }
                    }

                    const rataRata = jumlahMapel > 0 ? (totalNilai / jumlahMapel).toFixed(2) : "0";
                    let statusKat = "Sangat Baik";
                    if (rataRata < 70) statusKat = "Perlu Peningkatan";
                    else if (rataRata < 80) statusKat = "Cukup Baik";

                    dataSiswa = {
                        nis: cellNisClean,
                        nama: namaSiswa,
                        kelas: "9", // Default/Dinamis
                        nilai: mapelObj,
                        total: totalNilai,
                        avg: rataRata,
                        status: statusKat
                    };
                    break;
                }
            }

            tampilkanLoading(false);

            if (dataSiswa) {
                renderDataSiswa(dataSiswa);
            } else {
                tampilkanAlert(`NIS ${inputNis} tidak ditemukan dalam sistem!`, "error");
            }

        } catch (err) {
            console.error("Error Fetch Data:", err);
            tampilkanLoading(false);
            tampilkanAlert("Gagal terhubung ke Google Spreadsheet. Pastikan dokumen telah dipublikasikan ke web.", "error");
        }
    }

    // Function Render ke Tampilan UI
    function renderDataSiswa(data) {
        document.getElementById("resNama").innerText = data.nama;
        document.getElementById("resNis").innerText = data.nis;
        document.getElementById("resKelas").innerText = data.kelas;
        document.getElementById("resRataRata").innerText = data.avg;
        document.getElementById("resTotal").innerText = data.total;
        document.getElementById("resStatus").innerText = data.status;

        const tbody = document.getElementById("tabelNilaiBody");
        tbody.innerHTML = "";

        for (const [mapel, nilai] of Object.entries(data.nilai)) {
            const isAngka = typeof nilai === "number";
            const persen = isAngka ? Math.min(100, Math.max(0, nilai)) : 0;
            let colorClass = persen >= 85 ? "bg-emerald-500" : (persen < 70 ? "bg-amber-500" : "bg-blue-500");

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td class="py-3 px-4 font-medium text-slate-200">${mapel}</td>
                <td class="py-3 px-4 text-center font-bold text-white">${nilai}</td>
                <td class="py-3 px-4 hidden sm:table-cell">
                    <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                        <div class="${colorClass} h-2.5 rounded-full" style="width: ${persen}%"></div>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        }

        document.getElementById("areaHasil").classList.remove("hidden");
    }

    function tampilkanLoading(show) {
        document.getElementById("loadingSpinner").classList.toggle("hidden", !show);
    }

    function tampilkanAlert(msg, type) {
        const alertEl = document.getElementById("pesanAlert");
        alertEl.className = `p-4 rounded-xl text-sm font-medium flex items-center gap-3 ${
            type === 'error' ? 'bg-rose-500/10 border border-rose-500/20 text-rose-400' : 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400'
        }`;
        alertEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i><span>${msg}</span>`;
        alertEl.classList.remove("hidden");
    }

    function sembunyikanAlert() {
        document.getElementById("pesanAlert").classList.add("hidden");
    }
</script>
