<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publikasi Virtual Nilai PSTS - SMP PGRI 1 Kuwarasan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            .no-print { display: none !important; }
            .glass-card { background: none !important; border: none !important; box-shadow: none !important; color: #000000 !important; }
            .text-white, .text-slate-200, .text-slate-300 { color: #000000 !important; }
        }
    </style>
</head>
<body class="font-sans text-slate-100 antialiased pb-12">

    <!-- Header -->
    <header class="no-print pt-8 pb-6 px-4 text-center">
        <div class="max-w-4xl mx-auto flex flex-col items-center justify-center space-y-3">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30 mb-2">
                <i class="fa-solid fa-graduation-cap text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white">
                SMP PGRI 1 KUWARASAN
            </h1>
            <p class="text-sm sm:text-base text-blue-200 font-medium max-w-xl">
                Publikasi Virtual Hasil Murni Nilai PSTS Ganjil 2026/2027
            </p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 space-y-6">

        <!-- Form Pencarian NIS -->
        <section class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl no-print">
            <form id="formCari" onsubmit="cariNilaiSiswa(event)" class="space-y-4">
                <label for="nisInput" class="block text-sm font-semibold text-slate-300 text-center sm:text-left">
                    <i class="fa-solid fa-id-card text-blue-500 mr-2"></i>Masukkan Nomor Induk Siswa (NIS)
                </label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="nisInput" required placeholder="Contoh: 9911" 
                        class="glass-input w-full px-5 py-3.5 rounded-xl text-white placeholder-slate-400 focus:outline-none transition text-lg font-medium">
                    <button type="submit" id="btnCari" 
                        class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-8 py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Cek Nilai</span>
                    </button>
                </div>
                <div id="pesanAlert" class="hidden p-4 rounded-xl text-sm font-medium flex items-center gap-3"></div>
            </form>
        </section>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="hidden text-center py-12 no-print">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent"></div>
            <p class="mt-4 text-slate-300 font-medium">Menghubungi server Apps Script...</p>
        </div>

        <!-- Area Hasil Nilai -->
        <section id="areaHasil" class="hidden glass-card rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="border-b border-slate-700/60 pb-6 mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div>
                    <span class="inline-block px-3 py-1 bg-blue-500/20 text-blue-300 text-xs font-semibold rounded-full mb-2">
                        Kartu Hasil Studi (KHS)
                    </span>
                    <h2 id="resNama" class="text-2xl sm:text-3xl font-bold text-white">-</h2>
                    <p class="text-slate-400 text-sm mt-1">
                        NIS: <span id="resNis" class="font-semibold text-slate-200 mr-4">-</span>
                        Kelas: <span id="resKelas" class="font-semibold text-slate-200 mr-4">-</span>
                        Wali Kelas: <span id="resWalas" class="font-semibold text-slate-200">-</span>
                    </p>
                </div>
                <button onclick="window.print()" class="no-print bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-print text-blue-400"></i>
                    <span>Cetak / PDF</span>
                </button>
            </div>

            <!-- Ringkasan Statistik -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-8">
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-xs text-slate-400 font-medium">Rata-Rata Nilai</p>
                    <p id="resRataRata" class="text-2xl sm:text-3xl font-extrabold text-blue-400 mt-1">0</p>
                </div>
                <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-xs text-slate-400 font-medium">Total Nilai</p>
                    <p id="resTotal" class="text-2xl sm:text-3xl font-extrabold text-emerald-400 mt-1">0</p>
                </div>
                <div class="col-span-2 sm:col-span-1 bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                    <p class="text-xs text-slate-400 font-medium">Status Kategori</p>
                    <p id="resStatus" class="text-lg sm:text-xl font-bold text-amber-400 mt-1.5">-</p>
                </div>
            </div>

            <!-- Tabel Nilai -->
            <div class="overflow-x-auto rounded-xl border border-slate-700/60">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-800/80 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="py-3.5 px-4">Mata Pelajaran</th>
                            <th class="py-3.5 px-4 text-center">Nilai Murni</th>
                            <th class="py-3.5 px-4 hidden sm:table-cell">Visualisasi Kinerja</th>
                        </tr>
                    </thead>
                    <tbody id="tabelNilaiBody" class="divide-y divide-slate-700/50 bg-slate-900/30"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // TEMPATKAN URL WEB APP APPS SCRIPT ANDA DI SINI
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwk3jRawEOzDKKXKWPhZ1L0uYH7FqhNhRWTB4dANoLJH49JHVaKy2Xo3bsvBXFYops/exec";

        async function cariNilaiSiswa(e) {
            e.preventDefault();
            const inputNis = document.getElementById("nisInput").value.trim().replace(/\D/g, "");

            if (!inputNis) {
                tampilkanAlert("Masukkan NIS yang valid!", "error");
                return;
            }

            tampilkanLoading(true);
            sembunyikanAlert();
            document.getElementById("areaHasil").classList.add("hidden");

            try {
                // Panggil Web App Apps Script dengan parameter NIS
                const response = await fetch(`${APPS_SCRIPT_URL}?nis=${inputNis}`);
                const result = await response.json();

                tampilkanLoading(false);

                if (result.status === "success") {
                    renderDataSiswa(result.data);
                } else if (result.status === "not_found") {
                    tampilkanAlert(`NIS ${inputNis} tidak ditemukan dalam sistem!`, "error");
                } else {
                    tampilkanAlert(result.message || "Terjadi kesalahan pada server.", "error");
                }

            } catch (err) {
                console.error("Fetch Error:", err);
                tampilkanLoading(false);
                tampilkanAlert("Gagal terhubung ke Google Apps Script backend.", "error");
            }
        }

        function renderDataSiswa(data) {
            document.getElementById("resNama").innerText = data.nama;
            document.getElementById("resNis").innerText = data.nis;
            document.getElementById("resKelas").innerText = data.kelas;
            document.getElementById("resWalas").innerText = data.walas;
            document.getElementById("resRataRata").innerText = data.avg;
            document.getElementById("resTotal").innerText = data.total;
            document.getElementById("resStatus").innerText = data.status;

            const tbody = document.getElementById("tabelNilaiBody");
            tbody.innerHTML = "";

            for (const [mapel, nilai] of Object.entries(data.nilai)) {
                const persen = Math.min(100, Math.max(0, nilai));
                let colorClass = persen >= 85 ? "bg-emerald-500" : (persen < 70 ? "bg-amber-500" : "bg-blue-500");

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td class="py-3 px-4 font-medium text-slate-200">${mapel}</td>
                    <td class="py-3 px-4 text-center font-bold text-white">${nilai}</td>
                    <td class="py-3 px-4 hidden sm:table-cell">
                        <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                            <div class="${colorClass} h-2.5 rounded-full" style="width: ${persen}%"></div>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            }

            document.getElementById("areaHasil").classList.remove("hidden");
        }

        function tampilkanLoading(show) {
            document.getElementById("loadingSpinner").classList.toggle("hidden", !show);
        }

        function tampilkanAlert(msg, type) {
            const alertEl = document.getElementById("pesanAlert");
            alertEl.className = `p-4 rounded-xl text-sm font-medium flex items-center gap-3 ${
                type === 'error' ? 'bg-rose-500/10 border border-rose-500/20 text-rose-400' : 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-400'
            }`;
            alertEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i><span>${msg}</span>`;
            alertEl.classList.remove("hidden");
        }

        function sembunyikanAlert() {
            document.getElementById("pesanAlert").classList.add("hidden");
        }
    </script>
</body>
</html>
